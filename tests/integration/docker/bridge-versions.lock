# The integration matrix: which ROS 2 distros the suite runs on, the base
# image each builds from, and the package release apt must install for each.
#
# One row per line: <distro> <key> <value>
#   key "base": the base image, pinned by digest.
#   any other key: an apt package; value is its release, upstream version plus
#   Debian revision ("3.6.0-1"), without the buildfarm build stamp.
#
# check-bridge-versions.sh fails the image build when apt installs another
# release. packages.ros.org keeps only the current build of each package, so
# when upstream ships a new release every build of that distro goes red until
# this file is updated. That red is intended: a bridge release changes what
# the suite tests, and it lands here as a reviewed change, never as drift.
#
# Rolling is the exception: its packages say "latest". Rolling is the
# development distro and moves every few days, so a pin there only turns each
# upstream release into a red build fixed by a one-line edit. Its job is the
# early warning: a red Rolling run means the newest bridge broke something.
# The build log prints the release each run installed. A distributed distro
# that starts moving that fast does not get "latest": it stays pinned.
#
# Adding or retiring a distro is a change to this file.

