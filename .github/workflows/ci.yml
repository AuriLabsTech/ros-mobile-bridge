name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so an upstream bridge release that no longer matches
  # tests/integration/docker/bridge-versions.lock goes red on its own day
  # instead of on an unrelated push. Rolling follows the newest releases
  # instead ("latest" rows), so there it tests whether they still work.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  # The event name keeps the weekly run and a push to main from cancelling
  # each other.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Every public symbol is documented
        run: npm run docs:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check runtime license allowlist
        run: npm run check-licenses

      - name: Verify package source is free of forbidden imports
        run: |
          set -e
          ! grep -rE "from 'react-native'|from \"react-native\"|from 'expo|__DEV__|process\.env|Buffer\.from" src/ \
            || (echo "Forbidden imports/globals detected in src/" && exit 1)

  changelog:
    name: released changelog sections match their tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The check reads CHANGELOG.md at every release tag.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check
        run: node scripts/check-changelog.mjs

  integration:
    name: integration (${{ matrix.distro }}, ${{ matrix.rmw }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      # Every distro in bridge-versions.lock on the default middleware, plus
      # the two other middlewares on Jazzy only.
      matrix:
        distro: [humble, jazzy, kilted, lyrical, rolling]
        rmw: [rmw_fastrtps_cpp]
        include:
          - distro: jazzy
            rmw: rmw_cyclonedds_cpp
          - distro: jazzy
            rmw: rmw_zenoh_cpp
    env:
      RMB_ROS_DISTRO: ${{ matrix.distro }}
      RMB_RMW: ${{ matrix.rmw }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests against real bridges
        run: npm run test:integration

  example-smoke:
    name: example smoke (node 22)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack tarball
        id: pack
        run: |
          # The Build step above already produced dist/, so skip prepack's
          # redundant rebuild. --ignore-scripts also keeps build-tool banners
          # (e.g. tsup's "CLI Using tsconfig: ...") out of the captured value;
          # tail -n 1 guards against any future tool that still writes to
          # stdout, since a multi-line value corrupts $GITHUB_OUTPUT.
          TARBALL=$(npm pack --silent --ignore-scripts | tail -n 1)
          mv "$TARBALL" "/tmp/$TARBALL"
          echo "path=/tmp/$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Install example against packed tarball
        working-directory: examples/node
        run: |
          npm install --no-save "${{ steps.pack.outputs.path }}"

      - name: Run example smoke
        working-directory: examples/node
        run: node src/index.mjs
