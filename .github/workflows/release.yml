name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance attestation via GitHub OIDC

# Serialize runs per-tag so a re-delivered tag-push webhook can't race
# the first run to `npm publish`. v0.1.1 was published cleanly but the
# duplicate event spawned a second run that failed with
# "cannot publish over the previously published versions" — a noisy red
# X on an otherwise-correct release.
#
# `cancel-in-progress: false` (not `true`) is deliberate: a second run
# arriving mid-publish must NOT cancel the in-flight one — interrupting
# `npm publish` between byte upload and registry commit risks a
# half-published artifact. Queue the dup instead; when the first
# succeeds, the queued one will start, find the version already
# published, and fail fast at its own version check. Same end state as
# today, no race window.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Upgrade npm for trusted publishing
        # OIDC trusted publishing requires npm >= 11.5.1. Node 22 bundles
        # npm 10.x, so upgrade explicitly. Pinned to the v11 major to avoid
        # a future npm major silently changing release behavior.
        run: npm install -g npm@^11

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Verify CHANGELOG has a section for this version
        run: |
          if ! grep -qE "^## \[?${GITHUB_REF_NAME#v}\]?" CHANGELOG.md; then
            echo "CHANGELOG.md is missing a section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: License check
        run: npm run check-licenses

      - name: Build
        run: npm run build

      - name: Extract changelog section for this release
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull lines from "## [VERSION]" (or "## VERSION") up to the next "## "
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[?" ver "\\]?" { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/changelog-section.md
          echo "path=/tmp/changelog-section.md" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (trusted publishing via OIDC)
        # No NODE_AUTH_TOKEN: authentication is via GitHub OIDC, configured as
        # a trusted publisher on the npm package settings page (org/repo +
        # this workflow filename). The id-token: write permission above is
        # what lets npm verify the OIDC token. Provenance is generated from
        # the same OIDC identity.
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/changelog-section.md
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
